[package]
name = "modelbox-cli"
version = "0.1.0"
description = "Command-line interface for ModelBox Rust"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "modelbox"
path = "src/main.rs"

[dependencies]
modelbox-core = { path = "../modelbox-core" }
serde_json = "1"
png = { version = "0.18.1", optional = true }
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png"], optional = true }

[features]
default = []
onnx = ["modelbox-core/onnx", "dep:png", "dep:image"]
