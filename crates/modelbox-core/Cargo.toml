[package]
name = "modelbox-core"
version = "0.1.0"
description = "Typed, bounded and concurrent dataflow runtime for edge AI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
onnx = ["dep:ort"]

[dependencies.ort]
version = "=2.0.0-rc.13"
optional = true
default-features = false
features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27"]
