name: Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (check)
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: CLI smoke test
        run: cargo run -p modelbox-cli -- demo

  onnx-cpu:
    name: ONNX CPU inference (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ONNX CPU compile and inference
        run: cargo test -p modelbox-core --features onnx
      - name: ONNX CPU lint
        run: cargo clippy -p modelbox-core --features onnx --all-targets -- -D warnings
      - name: Inference CLI
        run: cargo run -p modelbox-cli --features onnx -- infer examples/relu.onnx examples/relu-input.json
