name: Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (check)
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: CLI smoke test
        run: cargo run -p modelbox-cli -- demo
      - name: Studio FlowUnit catalog smoke
        run: cargo run -p modelbox-cli -- catalog --json
      - name: Studio GraphSpec contract smoke
        run: |
          cargo run -p modelbox-cli -- validate examples/hello.json
          cargo run -p modelbox-cli -- run examples/hello.json studio-contract
      - name: YOLO raw detection postprocessing smoke test
        run: cargo run -p modelbox-cli -- postprocess-yolo examples/yolo-raw-output.json 640 640 0.25 0.5 10

  onnx-cpu:
    name: ONNX CPU inference (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ONNX CPU compile and inference
        run: cargo test -p modelbox-core --features onnx
      - name: ONNX CPU lint
        run: cargo clippy -p modelbox-core --features onnx --all-targets -- -D warnings
      - name: Inference CLI
        run: cargo run -p modelbox-cli --features onnx -- infer examples/relu.onnx examples/relu-input.json
      - name: Bench CLI smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench examples/relu.onnx examples/relu-input.json 5 1
      - name: Batch throughput smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-batch examples/relu.onnx examples/relu-input.json 32 2
      - name: Tensor graph overhead smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-overhead examples/relu-input.json 32 2
      - name: MNIST CNN CLI inference
        run: cargo run -p modelbox-cli --features onnx -- infer examples/mnist.onnx examples/mnist-1-input.json
      - name: MNIST PNG end-to-end classification
        run: cargo run -p modelbox-cli --features onnx -- infer-mnist-png examples/mnist.onnx examples/mnist-1.png
      - name: MNIST CNN three-path smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-compare examples/mnist.onnx examples/mnist-1-input.json 8 3 1
      - name: PNG decoder unit tests
        run: cargo test -p modelbox-cli --features onnx mnist_png::tests
      - name: Labeled MNIST test subset evaluation
        run: cargo run -p modelbox-cli --features onnx -- eval-mnist-csv examples/mnist.onnx benchmarks/fixtures/mnist-test-10.csv 10
      - name: Labeled MNIST CSV parser tests
        run: cargo test -p modelbox-cli --features onnx mnist_eval::tests
      - name: Download verified pretrained YOLOv8n and bus photograph
        shell: bash
        run: bash scripts/fetch-yolov8n-demo.sh
      - name: YOLOv8n actual photograph inference and box projection
        shell: bash
        run: |
          cargo run -p modelbox-cli --features onnx -- detect-yolov8 \
            benchmarks/datasets/detection/yolov8n.onnx \
            benchmarks/datasets/detection/bus.jpg 0.25 0.45 > yolo-detections.json
          python3 scripts/verify-yolov8n-demo.py yolo-detections.json
          python3 -m unittest discover -s scripts/tests -p 'test_verify_yolov8n_demo.py'
      - name: YOLOv8n stage benchmark functional smoke
        shell: bash
        run: |
          cargo run -p modelbox-cli --features onnx -- bench-detect-yolov8 \
            benchmarks/datasets/detection/yolov8n.onnx \
            benchmarks/datasets/detection/bus.jpg 2 1 > yolo-stages.json
          python3 -c 'import json; r=json.load(open("yolo-stages.json")); assert r["measured_iterations"] == 2; assert r["warmup_iterations"] == 1; assert r["max_stage_total_reconciliation_delta_ns"] == 0; assert r["last_detection_count"] == 5; assert all(r["latency_ms"][s]["mean"] > 0 for s in ("decode_file_and_rgb", "letterbox_and_chw", "graph_including_onnx_cpu", "nms_and_project_boxes", "end_to_end")); print("YOLO stage timing smoke:",r["profile"],r["latency_ms"]["end_to_end"]["mean"])'
      - name: YOLOv8n paired Graph vs direct ONNX CPU functional smoke
        shell: bash
        run: |
          cargo run -p modelbox-cli --features onnx -- bench-compare-yolov8 \
            benchmarks/datasets/detection/yolov8n.onnx \
            benchmarks/datasets/detection/bus.jpg 3 1 > yolo-graph-direct.json
          python3 -c 'import json; d=json.load(open("yolo-graph-direct.json")); assert d["measured_pairs"] == 3; assert d["warmup_pairs"] == 1; assert d["last_detection_count"] == 5; assert d["max_output_element_abs_diff"] <= 0.0001; assert d["graph_ms"]["mean"] > 0 and d["direct_flowunit_ms"]["mean"] > 0; print("Graph vs direct smoke:", d["graph_ms"]["mean"], d["direct_flowunit_ms"]["mean"])'
      - name: YOLO-sized owned tensor Graph transport control
        shell: bash
        run: |
          cargo run -p modelbox-cli --features onnx -- bench-transport-yolov8 \
            benchmarks/datasets/detection/bus.jpg 3 1 > yolo-transport.json
          python3 -c 'import json; x=json.load(open("yolo-transport.json")); assert x["output_matches_input_exactly"]; assert x["graph_tensor_buffer_reused"] and x["direct_tensor_buffer_reused"]; assert not x["onnx_model_loaded"]; assert x["same_graph_topology_as_onnx"]; assert x["input_tensor_bytes"] == 4915200; assert x["measured_pairs"] == 3; assert x["warmup_pairs"] == 1; assert len(x["paired_graph_minus_direct_ms"]) == 3; print("YOLO input transport smoke:", x["graph_identity_ms"]["mean"], x["direct_owned_identity_ms"]["mean"])'
      - name: MNIST IDX parser unit tests
        run: cargo test -p modelbox-cli --features onnx mnist_idx::tests
      - name: Download verified official MNIST test images and labels
        shell: bash
        run: bash scripts/fetch-mnist-test.sh
      - name: Evaluate all 10,000 MNIST test images
        run: cargo run -p modelbox-cli --features onnx -- eval-mnist-idx examples/mnist.onnx benchmarks/datasets/mnist/t10k-images-idx3-ubyte benchmarks/datasets/mnist/t10k-labels-idx1-ubyte 9850
      - name: Paired comparison smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-compare examples/relu.onnx examples/relu-input.json 16 3 1
      - name: Bench unit tests
        run: cargo test -p modelbox-cli --features onnx

