name: Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (check)
        run: cargo fmt --all -- --check
      - name: Compile
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: CLI smoke test
        run: cargo run -p modelbox-cli -- demo

  onnx-cpu:
    name: ONNX CPU inference (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ONNX CPU compile and inference
        run: cargo test -p modelbox-core --features onnx
      - name: ONNX CPU lint
        run: cargo clippy -p modelbox-core --features onnx --all-targets -- -D warnings
      - name: Inference CLI
        run: cargo run -p modelbox-cli --features onnx -- infer examples/relu.onnx examples/relu-input.json
      - name: Bench CLI smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench examples/relu.onnx examples/relu-input.json 5 1
      - name: Batch throughput smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-batch examples/relu.onnx examples/relu-input.json 32 2
      - name: Tensor graph overhead smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-overhead examples/relu-input.json 32 2
      - name: MNIST CNN CLI inference
        run: cargo run -p modelbox-cli --features onnx -- infer examples/mnist.onnx examples/mnist-1-input.json
      - name: MNIST CNN three-path smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-compare examples/mnist.onnx examples/mnist-1-input.json 8 3 1
      - name: Paired comparison smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-compare examples/relu.onnx examples/relu-input.json 16 3 1
      - name: Bench unit tests
        run: cargo test -p modelbox-cli --features onnx

  onnx-macos-arm64:
    name: ONNX CPU inference (macOS ARM64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify native Apple Silicon
        shell: bash
        run: |
          uname -m
          test "$(uname -m)" = "arm64"
      - name: ONNX CPU model tests
        run: cargo test -p modelbox-core --features onnx
      - name: ONNX CLI integration
        run: cargo run -p modelbox-cli --features onnx -- infer examples/relu.onnx examples/relu-input.json
      - name: Benchmark smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench examples/relu.onnx examples/relu-input.json 5 1
      - name: Batch throughput smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-batch examples/relu.onnx examples/relu-input.json 32 2
      - name: Tensor graph overhead smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-overhead examples/relu-input.json 32 2
      - name: MNIST CNN CLI inference
        run: cargo run -p modelbox-cli --features onnx -- infer examples/mnist.onnx examples/mnist-1-input.json
      - name: MNIST CNN three-path smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-compare examples/mnist.onnx examples/mnist-1-input.json 8 3 1
      - name: Paired comparison smoke test
        run: cargo run -p modelbox-cli --features onnx -- bench-compare examples/relu.onnx examples/relu-input.json 16 3 1
